<form id="frmProducto">
    <div class="card text-bg-dark mb-3" style="min-width: 600px;">
        <div class="card-header">
            <div class="d-flex">
                Admin de Productos
                <div class="ms-auto">
                    <button data-form="productos" type="button" class="btn-close btn-close-white"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-12 col-md-4">
                    <input pattern="^[0-9]{3,10}$" required placeholder="Codigo" name="txtCodigoProducto"
                        id="txtCodigoProducto" class="form-control" type="text">
                </div>
            </div>
            <div class="row p-1">
                <div class="col-12 col-md-10">
                    <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre" name="txtNombreProducto"
                        id="txtNombreProducto" class="form-control" type="text">
                </div>
            </div>
            <div class="row p-1">
                <div class="col-12 col-md-6">
                    <input placeholder="Marca" name="txtMarcaProducto"
                        id="txtMarcaProducto" class="form-control" type="text">
                </div>
            </div>
            <div class="row p-1">
                <div class="col-12 col-md-4">
                    <input placeholder="Precio" name="txtPrecioProducto" id="txtPrecioProducto" class="form-control"
                        type="number">
                </div>
            </div>
        </div>
        <div class="card-footer text-center">
            <input type="submit" value="Guardar" class="btn btn-primary" id="btnGuardarProducto">
            <input type="button" value="Buscar" class="btn btn-secondary" id="btnBuscarProducto">
            <input type="reset" value="Limpiar" class="btn btn-warning" id="btnLimpiarProducto">
        </div>
    </div>
</form>
<script>
    var accion = 'nuevo',
        id = '';

    frmProducto.addEventListener('submit', (e) => {
        e.preventDefault();
        guardarProductos();

    });
    frmProducto.addEventListener('reset', (e) => {
        e.preventDefault();
        limpiarProducto();
    });


    function modificarProducto(data, event) {
        event.preventDefault();
        id = data.id;
        accion = "modificar";

        txtCodigoProducto.value = data.codigo;
        txtNombreProducto.value = data.nombre;
        txtMarcaProducto.value = data.marca;
        txtPrecioProducto.value = Number(data.precio) ?? 0;

        alertify.success("Datos de producto cargados con exito.");
    }

    async function guardarProductos() {
        let datos = {
            modulo: "producto",
            codigo: txtCodigoProducto.value,
            nombre: txtNombreProducto.value,
            marca: txtMarcaProducto.value,
            precio: txtPrecioProducto.value,
            accion,
            id
        };
        let response = await fetch('guardar_producto/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        }), respuesta = await response.json();
        if (respuesta.msg != "ok") {
            alertify.error(`Error al guardar el producto ${respuesta.msg}`);
            return;
        }
        obtenerProductos();
        limpiarProducto();
    }
    function limpiarProducto() {
        accion = 'nuevo';
        id = '';
        txtCodigoProducto.value = '';
        txtNombreProducto.value = '';
        txtMarcaProducto.value = '';
        txtPrecioProducto.value = 0;
    }
    btnBuscarProducto.addEventListener('click', (e) => {
        e.preventDefault();
        cargarForm('busqueda_productos');
    });
</script>
