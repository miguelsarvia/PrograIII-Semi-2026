<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-6">
                <form id="frmCliente">
                    <div class="container text-center">
                        <div class="row">
                            <div class="col">
                                <input pattern="^[0-9]{3,10}$" required placeholder="Code" name="txtCodigoCliente"
                                    id="txtCodigoCliente" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre"
                                    name="txtNombreCliente" id="txtNombreCliente" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input placeholder="Direccion" name="txtDireccionCliente" id="txtDireccionCliente"
                                    class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Telefono" name="txtTelefonoCliente"
                                    id="txtTelefonoCliente" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input placeholder="Email" name="txtEmailCliente" id="txtEmailCliente"
                                    class="form-control" type="email">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <select class="form-control" name="cboTipoPersona" id="cboTipoPersona">
                                    <option value="particular">Particular</option>
                                    <option value="empresa">Empresa</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input type="submit" value="Guardar" class="btn btn-primary">
                                <input type="button" value="Buscar" class="btn btn-secondary">
                                <input type="reset" value="Limpiar" class="btn btn-warning">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-6">
                <form id="frmConsultarCliente">
                    <div class="container text-center">
                        <div class="row">
                            <div class="col">BUSQUEDA DE CLIENTES</div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="table-responsive">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th colspan="7">
                                                    <input type="search" placeholder="buscar por codigo, nombre"
                                                        id="txtBuscarCliente" name="txtBuscarCliente"
                                                        class="form-control">
                                                </th>
                                            </tr>
                                            <tr>
                                                <th>Codigo</th>
                                                <th>Nombre</th>
                                                <th>Direccion</th>
                                                <th>Telefono</th>
                                                <th>Email</th>
                                                <th>Tipo</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody id="tblClientes"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
<script>
    var accion = 'nuevo',
        idCliente = '';

    frmCliente.addEventListener('submit', (e) => {
        e.preventDefault();
        guardarClientes();

    });
    frmCliente.addEventListener('reset', (e) => {
        e.preventDefault();
        limpiarFormulario();
    });
    txtBuscarCliente.addEventListener('keyup', (e) => {
        e.preventDefault();
        obtenerClientes(txtBuscarCliente.value);
    });
    document.addEventListener("DOMContentLoaded", obtenerClientes);

    async function obtenerClientes(buscar = "") {
        let response = await fetch(`/clientes?buscar=${buscar}`),
            datos = await response.json();
        mostrarDatos(datos);
    }
    function mostrarDatos(datos) {
        let filas = "";
        datos.forEach(e => {
            filas += `
                <tr onClick='modificarCliente(${JSON.stringify(e)}, event)'>
                    <td>${e.codigo}</td>
                    <td>${e.nombre}</td>
                    <td>${e.direccion}</td>
                    <td>${e.telefono}</td>
                    <td>${e.email}</td>
                    <td>${e.tipo}</td>
                    <td>
                        <input onClick='eliminarCliente(${JSON.stringify(e)}, event)' 
                            type="button" value="DEL" class="btn btn-danger"/>
                    </td>
                </tr>
            `;
        });
        tblClientes.innerHTML = filas;
    }
    function modificarCliente(data, event) {
        event.preventDefault();
        idCliente = data.idCliente;
        accion = "modificar";

        txtCodigoCliente.value = data.codigo;
        txtNombreCliente.value = data.nombre;
        txtDireccionCliente.value = data.direccion;
        txtTelefonoCliente.value = data.telefono;
        txtEmailCliente.value = data.email;
        cboTipoPersona.value = data.tipo;
    }
    function eliminarCliente(data, event) {
        event.preventDefault();
        if (confirm(`¿Seguro de eliminar al cliente: ${data.nombre}?`)) {
            idCliente = data.idCliente;
            accion = "eliminar";
            guardarClientes();
        }
    }
    async function guardarClientes() {
        let datos = {
            codigo: txtCodigoCliente.value,
            nombre: txtNombreCliente.value,
            direccion: txtDireccionCliente.value,
            telefono: txtTelefonoCliente.value,
            email: txtEmailCliente.value,
            tipo: cboTipoPersona.value,
            accion,
            idCliente
        };
        let response = await fetch('/cliente', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        }), respuesta = await response.json();
        if (respuesta.msg != "ok") {
            alert("Error: " + respuesta.msg);
            return;
        }
        obtenerClientes();
        limpiarFormulario();
    }
    function limpiarFormulario() {
        accion = 'nuevo';
        idCliente = '';
        txtCodigoCliente.value = '';
        txtNombreCliente.value = '';
        txtDireccionCliente.value = '';
        txtTelefonoCliente.value = '';
        txtEmailCliente.value = '';
        cboTipoPersona.value = 'particular';
    }
</script>

<!-- Paste under customer form (left column) -->
<div class="card mt-3" id="panelImpuesto">
  <div class="card-header">
    Impuesto actividades económicas
  </div>
  <div class="card-body">
    <div class="input-group mb-2">
      <select id="impSelect" class="form-select" onchange="elegirClienteImpuesto()">
        <option value="">-- Seleccione un cliente --</option>
      </select>
      <button type="button" class="btn btn-outline-secondary" onclick="cargarClientesImpuesto()" title="Actualizar lista">&#8635;</button>
    </div>
    <div class="row g-2">
      <div class="col">
        <input id="impMonto" class="form-control" inputmode="decimal" placeholder="Monto (balance)">
      </div>
      <div class="col">
        <label class="form-label small mb-0" for="impDesde">Desde</label>
        <input id="impDesde" class="form-control" type="date">
      </div>
      <div class="col">
        <label class="form-label small mb-0" for="impHasta">Hasta (no incluido)</label>
        <input id="impHasta" class="form-control" type="date">
      </div>
    </div>
    <div class="form-check mt-2">
      <input class="form-check-input" type="checkbox" id="impHistorico">
      <label class="form-check-label" for="impHistorico">
        Período histórico (fórmula anterior proporcional, ej. 700 = 2.10)
      </label>
    </div>
    <button type="button" class="btn btn-primary mt-2" onclick="guardarPeriodo()">Calcular y guardar</button>
    <div id="impMsg" class="mt-2"></div>
    <table class="table table-sm mt-2">
      <thead>
        <tr><th>Desde</th><th>Hasta</th><th>Balance</th><th>Código</th><th>Precio</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody id="impTabla"></tbody>
    </table>
  </div>
</div>
 
<script>
let impClienteId = null;
 
function fmtFecha(iso) { return iso.split('-').reverse().join('/'); }
 
// Llamar esta función cuando se selecciona un cliente de la tabla:
//   seleccionarClienteImpuesto(cliente.idCliente, cliente.nombre)
function seleccionarClienteImpuesto(id, nombre) {
  impClienteId = id;
  document.getElementById('impSelect').value = id;
  document.getElementById('impMsg').textContent = '';
  cargarPeriodos();
}
 
// Llena la lista desplegable con los clientes guardados
async function cargarClientesImpuesto() {
  const r = await fetch('/clientes?buscar=');
  const clientes = await r.json();
  const sel = document.getElementById('impSelect');
  sel.length = 1;
  clientes.forEach(c => {
    const o = document.createElement('option');
    o.value = c.idCliente;
    o.textContent = c.codigo + ' - ' + c.nombre + ' (' + c.tipo + ')';
    sel.appendChild(o);
  });
  if (impClienteId) sel.value = impClienteId;
}
 
function elegirClienteImpuesto() {
  impClienteId = document.getElementById('impSelect').value || null;
  document.getElementById('impMsg').textContent = '';
  cargarPeriodos();
}
 
cargarClientesImpuesto();
 
function mostrarMensaje(texto, tipo) {
  const d = document.getElementById('impMsg');
  d.className = 'mt-2 alert alert-' + tipo;
  d.textContent = texto;
}
 
async function cargarPeriodos() {
  const cuerpo = document.getElementById('impTabla');
  cuerpo.innerHTML = '';
  if (!impClienteId) return;
  const r = await fetch('/periodos?idCliente=' + encodeURIComponent(impClienteId));
  const filas = await r.json();
  filas.forEach(p => {
    const tr = document.createElement('tr');
    [fmtFecha(p.desde), fmtFecha(p.hasta), '$' + p.balance, p.codigo, '$' + p.impuestoMensual, p.estado].forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    const tdAccion = document.createElement('td');
    if (!p.facturado) {
      const b = document.createElement('button');
      b.className = 'btn btn-danger btn-sm';
      b.textContent = 'DEL';
      b.onclick = () => eliminarPeriodo(p.idPeriodo);
      tdAccion.appendChild(b);
    }
    tr.appendChild(tdAccion);
    cuerpo.appendChild(tr);
  });
}
 
async function enviarPeriodo(datos) {
  const r = await fetch('/periodos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(datos)
  });
  return r.json();
}
 
async function guardarPeriodo() {
  if (!impClienteId) { mostrarMensaje('Seleccione un cliente primero.', 'warning'); return; }
  const res = await enviarPeriodo({
    accion: 'nuevo',
    idCliente: impClienteId,
    monto: document.getElementById('impMonto').value,
    fechaDesde: document.getElementById('impDesde').value,
    fechaHasta: document.getElementById('impHasta').value,
    formula: document.getElementById('impHistorico').checked ? 'proporcional' : 'bloques'
  });
  if (!res.ok) {
    mostrarMensaje(res.msg, 'danger');
    if (res.msg.includes('no encontrado')) cargarClientesImpuesto();
    return;
  }
  let texto = 'Impuesto mensual: ' + res.impuestoMensual;
  if (res.avisos && res.avisos.length) texto += ' | ' + res.avisos.join(' ');
  mostrarMensaje(texto, res.avisos && res.avisos.length ? 'warning' : 'success');
  cargarPeriodos();
}
 
async function eliminarPeriodo(id) {
  if (!confirm('¿Eliminar este período?')) return;
  const res = await enviarPeriodo({ accion: 'eliminar', idPeriodo: id });
  if (!res.ok) { mostrarMensaje(res.msg, 'danger'); return; }
  cargarPeriodos();
}
</script>
 
 
</html>
